[package]
name = "astrodyn_gravity"
description = "Spherical-harmonics gravity (Gottlieb), tides, and third-body for the astrodyn orbital-dynamics pipeline"
readme = "README.md"
keywords = ["gravity", "spherical-harmonics", "orbital-mechanics", "aerospace", "physics"]
categories = ["science", "aerospace"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# Cargo defaults to publishing only `src/` plus a few well-known files.
# We need the binary gravity fixtures (~1.9 MB total) to ride along so
# `include_bytes!` in `src/data.rs` resolves correctly when building
# from the published .crate.
include = [
    "src/**",
    "test_data/gravity/*.bin",
    "test_data/gravity/*.json",
    "README.md",
    "Cargo.toml",
    "LICENSE-APACHE",
    "LICENSE-MIT",
]

[package.metadata.docs.rs]
all-features = true

[lib]
# Disable the default cargo-test bench harness on the lib target so
# criterion bench CLI flags (`--quick`, `--measurement-time`, …) don't
# get rejected by the unittest runner. The lib's correctness is
# checked by `cargo test`; benches don't need to re-run unit tests.
bench = false

[dependencies]
astrodyn_math = { path = "../astrodyn_math", version = "0.1.0" }
astrodyn_dynamics = { path = "../astrodyn_dynamics", version = "0.1.0" }
astrodyn_quantities = { path = "../astrodyn_quantities", version = "0.1.0" }
glam = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
uom = { workspace = true }
# `sha2` is consumed by the `extract_*` regen binaries (to record
# SHA-256 of the produced `.bin` fixtures in the per-file JSON sidecars)
# and by the metadata-integrity test under `tests/`. Lives in regular
# deps because `src/bin/` binaries cannot link `[dev-dependencies]`.
sha2 = { workspace = true }

[dev-dependencies]
astrodyn_time = { path = "../astrodyn_time", version = "0.1.0" }
astrodyn_frames = { path = "../astrodyn_frames", version = "0.1.0" }
astrodyn_quantities = { path = "../astrodyn_quantities", version = "0.1.0", features = ["test-utils"] }
proptest = "1"
tempfile = "3"
criterion = { workspace = true }
pprof = { workspace = true }

[[bench]]
name = "accumulate"
harness = false

# Combined integration + gravity bench. Lives here (not in
# `astrodyn_dynamics`) because `astrodyn_gravity` already depends on
# `astrodyn_dynamics`; the inverse dev-dep would create a cycle and
# `cargo` rejects it. Diffing `trivial_accel` against `degree60_accel`
# tells whether a regression sits in RK4 plumbing or the gravity
# kernel.
[[bench]]
name = "integration"
harness = false

[lints]
workspace = true
