[package]
name = "astrodyn_dynamics"
description = "Rigid-body dynamics, integrators (RK4, RKF45, GJ, ABM4), mass tree, and body initialization"
readme = "README.md"
keywords = ["orbital-mechanics", "dynamics", "integrator", "aerospace", "simulation"]
categories = ["science", "aerospace", "simulation"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true

[lib]
# See `astrodyn_gravity/Cargo.toml` for rationale — disables the default
# cargo-test bench harness so criterion flags reach our `[[bench]]`s.
bench = false

[dependencies]
astrodyn_frames = { path = "../astrodyn_frames", version = "0.1.0" }
astrodyn_math = { path = "../astrodyn_math", version = "0.1.0" }
astrodyn_quantities = { path = "../astrodyn_quantities", version = "0.1.0" }
glam = { workspace = true }
uom = { workspace = true }

[dev-dependencies]
astrodyn_math = { path = "../astrodyn_math", version = "0.1.0", features = ["test-utils"] }
astrodyn_quantities = { path = "../astrodyn_quantities", version = "0.1.0", features = ["test-utils"] }
astrodyn_verif_jeod_fixtures = { path = "../astrodyn_verif_jeod_fixtures" }
sha2 = "0.10"
proptest = "1"

[lints]
workspace = true
