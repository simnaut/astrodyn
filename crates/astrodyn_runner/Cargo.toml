[package]
name = "astrodyn_runner"
description = "Standalone arena-state simulation harness driving the astrodyn pipeline without Bevy ECS"
readme = "README.md"
keywords = ["orbital-mechanics", "simulation", "propagator", "aerospace"]
categories = ["science", "aerospace", "simulation"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
astrodyn = { path = "../..", version = "0.1.0" }
astrodyn_dynamics = { path = "../astrodyn_dynamics", version = "0.1.0" }
astrodyn_gravity = { path = "../astrodyn_gravity", version = "0.1.0" }
astrodyn_time = { path = "../astrodyn_time", version = "0.1.0" }
astrodyn_frames = { path = "../astrodyn_frames", version = "0.1.0" }
astrodyn_interactions = { path = "../astrodyn_interactions", version = "0.1.0" }
astrodyn_math = { path = "../astrodyn_math", version = "0.1.0" }
astrodyn_quantities = { path = "../astrodyn_quantities", version = "0.1.0" }
glam = { workspace = true }
log = { workspace = true }
uom = { workspace = true }

[dev-dependencies]
astrodyn_atmosphere = { path = "../astrodyn_atmosphere", version = "0.1.0" }

[[example]]
name = "batch_propagation"
path = "examples/batch_propagation.rs"

[[example]]
name = "leo_drag"
path = "examples/leo_drag.rs"
