[package]
name = "astrodyn_runner"
description = "Standalone arena-state simulation harness that owns all state and drives the astrodyn pipeline — batch propagation and the Tier 3 test harness"
readme = "README.md"
keywords = ["orbital-mechanics", "simulation", "propagator", "aerospace"]
categories = ["science", "aerospace", "simulation"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
# See `astrodyn_gravity/Cargo.toml` for rationale — disables the default
# cargo-test bench harness so criterion flags reach our `[[bench]]`s.
bench = false

[dependencies]
astrodyn = { path = "../..", version = "0.2.0" }
glam = { workspace = true }
log = { workspace = true }
uom = { workspace = true }

[features]
# Enable per-phase wall-clock instrumentation in `Simulation::step_internal`.
# Off by default — adds `Instant::now()` deltas at the JEOD pipeline-stage
# boundaries (~7 sites × ~50 ns/site = ~350 ns per step on x86_64 Linux).
#
# Safe with respect to bit-identity: the timing calls do not touch f64
# state, so `bevy_parity_*` tests are unaffected when this feature is on.
# But the default workspace build leaves it off so production binaries
# pay zero overhead.
#
# Inspect timings via `Simulation::phase_timings()` and
# `Simulation::phase_timings_summary()`.
phase_timing = []

# Frame-document exchange (issue #663): `Simulation::export_frame_document`
# / `apply_frame_document` / `FrameSeriesRecorder`. Off by default — same
# serde-free-production rationale as the gateway's `frame-doc` feature,
# which this forwards to.
frame-doc = ["astrodyn/frame-doc"]

[[example]]
name = "batch_propagation"
path = "examples/batch_propagation.rs"

[[example]]
name = "leo_drag"
path = "examples/leo_drag.rs"

[lints]
workspace = true
