[package]
name = "astrodyn_verif_jeod"
description = "JEOD cross-validation parsers, fixtures, scenario rigs, and Tier 3 trajectory tests"
keywords = ["verification", "validation", "aerospace", "simulation"]
categories = ["science", "aerospace", "simulation"]
readme = "README.md"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
exclude = [
    "test_data/*.csv",
    "test_data/*.out",
    "test_data/jeod_inputs/**",
    "assets/*.bsp",
]

[lib]
# Disable the default cargo-test bench harness so criterion bench CLI
# flags reach our `[[bench]]`s without being intercepted by the
# unittest runner. See `astrodyn_gravity/Cargo.toml` for rationale.
bench = false

[dependencies]
astrodyn = { path = "../..", version = "0.2.0" }
# `frame-doc` (issue #663): the tier3_frame_doc serialize/reload/continue
# tests exercise the runner's frame-document export/apply surface; enabling
# the feature here keeps those tests compiling under a plain
# `cargo nextest run --workspace` (cargo feature unification).
astrodyn_runner = { path = "../astrodyn_runner", version = "0.2.0", features = ["frame-doc"] }
astrodyn_verif_jeod_fixtures = { path = "../astrodyn_verif_jeod_fixtures", version = "0.2.0" }
glam = { workspace = true }
log = { workspace = true }
regex = "1"
thiserror = { workspace = true }
uom = { workspace = true }
# `sha2` is consumed by the `extract_*` regen binaries (to record SHA-256
# of produced fixtures in their JSON sidecars) and by the
# metadata-integrity test under `tests/`. Lives in regular deps because
# `src/bin/` binaries cannot link `[dev-dependencies]`.
sha2 = { workspace = true }

[dev-dependencies]
# Full-step microbench for `Simulation::step()`. Lives here (not in
# `astrodyn_runner`) because the bench builds the Earth–Moon scenario
# via `setups::earth_moon_clem`, which lives in this crate. Putting
# the bench on the runner side would require `astrodyn_runner` to dev-
# depend on `astrodyn_verif_jeod`, and this crate already depends on
# `astrodyn_runner` — the inverse edge would form a cycle.
criterion = { workspace = true }
pprof = { workspace = true }

[features]
# Pass-through for `astrodyn_runner`'s per-phase wall-clock instrumentation.
# Off by default. When on, the `earth_moon` example prints a per-phase
# summary at the end of its run. Use it for performance investigation:
# `cargo run --release --example earth_moon -p astrodyn_verif_jeod \
#   --features phase_timing -- --steps 100000`.
phase_timing = ["astrodyn_runner/phase_timing"]

[[example]]
name = "earth_moon"
path = "examples/earth_moon.rs"

[[example]]
name = "mars_orbit"
path = "examples/mars_orbit.rs"

[[bench]]
name = "step"
harness = false

[lints]
workspace = true
