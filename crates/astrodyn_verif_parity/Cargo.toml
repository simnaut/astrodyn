[package]
name = "astrodyn_verif_parity"
description = "Parity tests asserting bit-identical state between astrodyn_runner (arena) and astrodyn_bevy (ECS)"
keywords = ["verification", "parity", "aerospace", "simulation"]
categories = ["science", "aerospace", "simulation"]
readme = "README.md"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
astrodyn = { path = "../..", version = "0.2.0" }
# `frame-doc` (issues #663/#664): the bevy_parity_frame_doc suite pins the
# document layer's cross-backend export equality and cross-restores.
astrodyn_bevy = { path = "../astrodyn_bevy", version = "0.2.0", features = ["frame-doc"] }
# `frame-doc` (issue #663): bevy_parity_frame_doc pins the runner's
# snapshot/restore cycle as invisible to cross-backend parity.
astrodyn_runner = { path = "../astrodyn_runner", version = "0.2.0", features = ["frame-doc"] }
astrodyn_verif_jeod = { path = "../astrodyn_verif_jeod", version = "0.2.0" }
astrodyn_verif_nesc = { path = "../astrodyn_verif_nesc", version = "0.2.0" }
bevy = { workspace = true }
glam = { workspace = true }
log = { workspace = true }
uom = { workspace = true }

[lints]
workspace = true
