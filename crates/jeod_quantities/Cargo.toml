[package]
name = "jeod_quantities"
description = "Phantom-tagged typed quantities (Position, Velocity, ...) for orbital dynamics"
keywords = ["orbital-mechanics", "physics", "type-system", "aerospace"]
categories = ["science", "aerospace", "data-structures"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
glam = { workspace = true }
uom = { workspace = true }
typenum = { workspace = true }
thiserror = { workspace = true }

[features]
# Exposes test-only phantom markers (e.g. `TestVehicle`) so downstream crates
# can write frame-composition tests without needing to implement sealed
# marker traits. Never enabled in production builds.
test-utils = []
