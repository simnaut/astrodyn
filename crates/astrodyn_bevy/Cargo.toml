[package]
name = "astrodyn_bevy"
description = "Bevy ECS adapter for the astrodyn orbital-dynamics gateway"
keywords = ["bevy", "orbital-mechanics", "simulation", "aerospace", "astrodyn"]
categories = ["science", "simulation", "aerospace"]
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Promote Bevy schedule ambiguity detection to `LogLevel::Error` on every
# schedule the plugin populates. Any unordered conflicting access between
# two systems panics on `App` build with the offending pair named.
# Off by default — production builds keep Bevy's default
# `LogLevel::Ignore`, which has zero runtime cost. The dedicated
# `schedule-audit` CI job (`.github/workflows/ci.yml`) exercises the full
# test suite with this feature on as a regression fence against future
# additions that introduce a new ambiguity. See issue #562.
schedule_audit = ["bevy/debug"]

# Frame-document exchange (issue #664): `frame_doc::export_frame_document`
# / `apply_frame_document` — the ECS mirror of the runner's document IO.
# Off by default — same serde-free-production rationale as the gateway's
# `frame-doc` feature, which this forwards to. Identity itself (`FrameUidC`,
# `FrameUidIndexR`, `FrameEpochC`) is core and NOT behind this feature.
frame-doc = ["astrodyn/frame-doc"]

[dependencies]
astrodyn = { path = "../..", version = "0.2.0" }
glam = { workspace = true }
bevy = { workspace = true }
bevy_reflect = { workspace = true }

[dev-dependencies]
glam = { workspace = true }
astrodyn_verif_jeod = { path = "../astrodyn_verif_jeod" }
astrodyn_runner = { path = "../astrodyn_runner" }
uom = { workspace = true }

[[example]]
name = "kepler_orbit"
path = "examples/kepler_orbit.rs"

[[example]]
name = "typed_mission"
path = "examples/typed_mission.rs"

[[example]]
name = "multi_body_scenario"
path = "examples/multi_body_scenario.rs"

[lints]
workspace = true
