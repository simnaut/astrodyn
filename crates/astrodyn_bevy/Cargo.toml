[package]
name = "astrodyn_bevy"
description = "Bevy ECS adapter for the astrodyn orbital-dynamics gateway"
keywords = ["bevy", "orbital-mechanics", "simulation", "aerospace", "astrodyn"]
categories = ["science", "simulation", "aerospace"]
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
astrodyn = { path = "../..", version = "0.1.0" }
glam = { workspace = true }
bevy = { workspace = true }
bevy_reflect = { workspace = true }

[dev-dependencies]
glam = { workspace = true }
astrodyn_verif_jeod = { path = "../astrodyn_verif_jeod", version = "0.1.0" }
astrodyn_runner = { path = "../astrodyn_runner", version = "0.1.0" }
uom = { workspace = true }

[[example]]
name = "kepler_orbit"
path = "examples/kepler_orbit.rs"

[[example]]
name = "typed_mission"
path = "examples/typed_mission.rs"

[[example]]
name = "multi_body_scenario"
path = "examples/multi_body_scenario.rs"

[lints]
workspace = true
