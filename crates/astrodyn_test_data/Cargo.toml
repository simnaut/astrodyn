[package]
name = "astrodyn_test_data"
description = "JEOD reference-data parsers and Tier 3 baseline tooling for astrodyn_bevy"
readme = "README.md"
keywords = ["jeod", "test-data", "verification", "aerospace"]
categories = ["science", "aerospace", "development-tools"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.docs.rs]
all-features = true

[dependencies]
astrodyn_quantities = { path = "../astrodyn_quantities", version = "0.1.0" }
# `astrodyn_gravity` is a one-way dep here so the `jeod_cc` parser can return
# `SphericalHarmonicsData`. `astrodyn_gravity` itself does NOT depend on
# `astrodyn_test_data` (would be a cycle); the production crate is unaware
# the parser exists.
astrodyn_gravity = { path = "../astrodyn_gravity", version = "0.1.0" }
# `astrodyn_math` exposes `JeodQuat` so the `apollo_truth` loader can return
# JEOD-typed quaternions directly.
astrodyn_math = { path = "../astrodyn_math", version = "0.1.0" }
glam = { workspace = true }
regex = "1"
thiserror = { workspace = true }
uom = { workspace = true }
