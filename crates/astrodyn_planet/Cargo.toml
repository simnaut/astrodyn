[package]
name = "astrodyn_planet"
description = "Planet definitions and presets (Earth, Moon, Sun, Mars) for the astrodyn orbital-dynamics pipeline"
readme = "README.md"
keywords = ["planet", "ephemeris", "orbital-mechanics", "aerospace"]
categories = ["science", "aerospace"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.docs.rs]
all-features = true

[dependencies]
astrodyn_quantities = { path = "../astrodyn_quantities", version = "0.1.0" }
glam = { workspace = true }
# `regex` is consumed only by the `extract_planet_pfixposn` regen binary;
# excluded from publishes via `[package] exclude` if/when this crate is
# published.
regex = "1"
# `sha2` is consumed by the `extract_planet_pfixposn` regen binary to
# record SHA-256 of the produced JSON fixture, and by the
# metadata-integrity test under `tests/`. Lives in regular deps because
# `src/bin/` binaries cannot link `[dev-dependencies]`.
sha2 = { workspace = true }
uom = { workspace = true }

[dev-dependencies]
astrodyn_math = { path = "../astrodyn_math", version = "0.1.0" }

[lints]
workspace = true
