[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Only used by the `generate-orientation-kernels` subcommand, which converts
# NAIF text kernels (FK / TPC) into ANISE binary form (.epa / .pca). The KPL
# parser/converters are not feature-gated, so default-features can stay off
# (drops rayon/csv/hyperdual/metaload).
anise = { version = "0.10", default-features = false }

[lints]
workspace = true
