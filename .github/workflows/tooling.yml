# Tooling-hygiene CI (#527): supply-chain, MSRV, public-API, feature matrix.
#
# Lives separately from `ci.yml` so the heavy Tier 3 / parity / perf-budget
# matrix can evolve independently of the supply-chain / API-surface fences.
# All jobs here are unconditional on PRs and pushes to main — they are cheap
# enough (no fixture data, no Tier 3 propagation) that path-filtering would
# add more complexity than it saves.

name: Tooling

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on PR branches; never cancel a run on main so the
# advisory database refresh and MSRV gate complete for every merged commit.
concurrency:
  group: tooling-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # Tier 3 / parity panics in `ci.yml` already benefit from a stack trace; the
  # tooling jobs here inherit the same posture for `cargo check` ICEs and
  # cargo-deny crashes.
  RUST_BACKTRACE: 1

jobs:
  cargo-deny:
    # Supply-chain fence. `cargo deny check` runs all four sections from
    # `deny.toml` at the repo root: advisories (RUSTSEC), licenses (SPDX
    # allowlist), bans (duplicate detection — warn-mode), sources (crates.io-
    # only). New advisories against any dep fail this job.
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          # Advisories DB is fetched fresh on every run; no caching of the
          # advisory state — a 24-hour-old cache hit would defeat the point.

  msrv:
    # MSRV gate at Rust 1.95 (matches `rust-version` in [workspace.package]).
    # `cargo check --workspace --all-targets` exercises lib, bin, test, bench,
    # and example targets — catches stdlib drift (cfg-gated syntax, transitive-
    # dep MSRV bumps) that `clippy::incompatible_msrv` on stable cannot see.
    # The 1.95 floor is set by bevy 0.19's own `rust-version` declaration;
    # see `README.md` § "Minimum supported Rust version" for the bump policy.
    name: MSRV (1.95)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
        with:
          # Distinct cache key from the stable-toolchain jobs in `ci.yml` so
          # 1.95 artifacts don't poison `cargo build` on stable and vice versa.
          key: msrv-1.95
      - run: cargo check --workspace --all-targets

  cargo-semver-checks:
    # Public-API regression *signal* on the single crate nominally published
    # to crates.io (`astrodyn`). Other workspace members are path-only deps
    # inside this repo and have no external consumers.
    #
    # ADVISORY, not gating (supersedes the #527 "gating from day one"
    # decision). Rationale: this is a 0.x JEOD port in active wave-by-wave
    # development whose dominant change mode is *additive growth of ported
    # physics*, the crates.io release is stuck at 0.1.1 (no v0.2.0 tag — the
    # in-repo version bumps never shipped), and the gate already compares
    # against `origin/main` rather than the unbuildable published baseline.
    # Enforcing strict public-API stability under those conditions fired the
    # gate on safe, expected changes and forced a cross-workspace version-bump
    # ceremony that protected no real consumer. The recurring offender —
    # `BodyAction` variant growth — is now neutralized at the source by
    # `#[non_exhaustive]`. `continue-on-error` keeps the signal visible in CI
    # (regressions still show up) without blocking merge. Restore gating +
    # the version-bump policy when `astrodyn` approaches 1.0 and is actually
    # published with a stable, externally-consumed public surface.
    name: cargo-semver-checks (astrodyn, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      # Full history so the `main` baseline rev below is available locally.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: semver-checks
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: astrodyn
          # Compare against the `main` branch, not the crates.io release.
          # The published 0.1.1 baseline is unbuildable on a fresh (unlocked)
          # resolve since nalgebra 0.35.0 (2026-05-24) — anise pulls two
          # incompatible nalgebra majors via its hyperdual edge. A published
          # manifest can't be patched; `main` can, so the git baseline stays
          # buildable. (Also a better regression fence for a pre-1.0 crate.)
          #
          # Use the remote-tracking ref, not the bare branch name: on
          # `pull_request` runs `actions/checkout` lands in detached HEAD and
          # creates no local `main` ref, so `--baseline-rev main` fails with
          # "couldn't parse revision: main^{tree}". `origin/main` exists after
          # `fetch-depth: 0` on both push and pull_request events.
          baseline-rev: origin/main

  cargo-hack:
    # Feature-matrix fence on `astrodyn_ephemeris`. `README.md` documents
    # `--no-default-features` as the air-gapped build path (used with the
    # `$ASTRODYN_EPHEMERIS_KERNELS_DIR` flow), but the default workspace
    # `cargo check` only ever exercises the default feature set. Without this
    # job, a regression that breaks the no-default build surfaces only in
    # customer environments. Extend `-p` as other crates grow feature flags.
    name: cargo-hack (astrodyn_ephemeris feature-powerset)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: cargo-hack
      - uses: taiki-e/install-action@cargo-hack
      - run: cargo hack check -p astrodyn_ephemeris --feature-powerset --no-dev-deps
