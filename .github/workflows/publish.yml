name: publish

# Tag-triggered crates.io release. Pushing a `v*` tag (e.g. `v0.1.0`)
# kicks off this workflow, which:
#   1. Verifies the tag matches `[workspace.package].version` so we
#      can't accidentally tag `v0.1.1` while the workspace still says
#      `0.1.0`.
#   2. Walks the 13 publishable crates in topological order via
#      `cargo xtask publish` (which polls the sparse index between
#      crates so the next crate's path+version dep resolves).
#
# Prerequisite: a repo-level `CARGO_REGISTRY_TOKEN` secret with
# publish scope on each of the 13 `astrodyn*` crates.

on:
  push:
    tags: ["v*"]
  # Manual recovery path. After a partial publish (e.g. crates.io index
  # propagation timeout halfway through the sequence), trigger with
  # `--ref v<X.Y.Z>` so the tag-version verify step still binds to the
  # release commit, and pass `from_crate` to skip crates the registry
  # has already accepted.
  workflow_dispatch:
    inputs:
      from_crate:
        description: "Resume from this crate (leave empty to start at astrodyn_quantities)."
        required: false
        type: string
      no_wait:
        description: "Skip the post-publish sparse-index poll between crates."
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish workspace to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Verify tag matches workspace version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ws_version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name=="astrodyn") | .version')"
          if [ "$tag" != "$ws_version" ]; then
            echo "::error::tag $tag does not match workspace version $ws_version"
            echo "Bump [workspace.package].version in Cargo.toml or retag."
            exit 1
          fi
          echo "tag $tag matches workspace version $ws_version"

      - name: Publish workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          FROM_CRATE: ${{ inputs.from_crate }}
          NO_WAIT: ${{ inputs.no_wait }}
        # Invoke xtask directly rather than via the `cargo xtask`
        # alias — the alias lives in `.cargo/config.toml.example`,
        # which contributors copy locally but is intentionally not
        # checked in (it also sets JEOD_HOME / TRICK_HOME defaults
        # that don't belong on every machine).
        #
        # FROM_CRATE / NO_WAIT are unset for tag pushes (empty
        # `inputs.*`) and only populated when triggered via
        # `workflow_dispatch` for recovery.
        run: |
          args=()
          if [ -n "$FROM_CRATE" ]; then
            args+=("--from" "$FROM_CRATE")
          fi
          if [ "$NO_WAIT" = "true" ]; then
            args+=("--no-wait")
          fi
          cargo run --package xtask -- publish "${args[@]}"
