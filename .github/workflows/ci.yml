name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --tests --examples -- -D warnings -D deprecated
      - name: Escape-hatch grep guard
        run: scripts/check_no_escape_hatches.sh
      - name: Gateway-bypass dep guard (#390)
        run: scripts/check_no_bypass_deps.sh

  test-examples:
    name: Smoke run examples
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p astrodyn_bevy --example kepler_orbit -- --steps 10
      - run: cargo run -p astrodyn_bevy --example typed_mission -- --steps 10

  test-quantities:
    name: Test (astrodyn_quantities)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run -p astrodyn_quantities

  docs-enforce:
    name: Docs (rustdoc -D warnings + doctests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build workspace docs (public + private, deny warnings)
        # `--document-private-items` surfaces broken intra-doc links and
        # invalid HTML tags inside private items (`fn`, `struct`, fields).
        # The workspace's [workspace.lints.rustdoc] table already denies
        # these; running the strict-warnings build keeps drift from landing.
        run: cargo doc --workspace --no-deps --document-private-items --quiet
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Run workspace doctests
        run: cargo test --doc --workspace

  compile-time-budget:
    name: Compile-time budget (envelope)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Measure cold workspace check time
        run: |
          # pipefail so a failed `cargo check` makes the step fail rather than
          # being masked by `tee`'s exit code (GH Actions' default bash has
          # neither pipefail nor errexit on by default).
          set -eo pipefail
          # Ensure a fresh workspace build even if rust-cache restored target artifacts;
          # the budget is meant to track cold compile time, not warm re-check time.
          cargo clean
          # Measure wall clock ourselves — cargo prints "in 1m 23s" once the time
          # crosses 60s, so parsing "in Ns" from cargo output breaks right when
          # we'd care. `date +%s` is robust regardless of cargo's format.
          start=$(date +%s)
          cargo check --workspace --timings 2>&1 | tee check.log
          end=$(date +%s)
          DURATION=$((end - start))
          echo "cargo check --workspace took ${DURATION}s (budget: 300s envelope for Phase 0 of #101)"
          # Hard fail only if grossly over budget; Phase 0 is envelope-only.
          if [ "$DURATION" -ge 300 ]; then
            echo "::error::compile-time budget exceeded: ${DURATION}s >= 300s"
            exit 1
          fi

  test:
    name: Test (unit + tier 2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Verify JEOD env vars are unset (regression fence)
        run: |
          if [ -n "${JEOD_HOME:-}" ] || [ -n "${JEOD_PATH:-}" ]; then
            echo "FATAL: JEOD_HOME / JEOD_PATH must be unset for the standalone-repo CI fence" >&2
            exit 1
          fi
      # The `bevy_parity_*` tests share the Tier 3 cost profile: each
      # parity wrapper runs the same scenario through `astrodyn_runner`
      # and `astrodyn_bevy` in lockstep, so the runtime cost is
      # comparable to a Tier 3 trajectory run. They run in the
      # dedicated `test-parity-trajectory` job below to keep this
      # unit/Tier-2 lane fast.
      - name: Run tests (skip Tier 3 trajectory validation and bevy parity)
        run: cargo nextest run --workspace -E 'not test(tier3_) and not test(bevy_parity)'

  test-parity-trajectory:
    name: Test (parity trajectory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Verify JEOD env vars are unset (regression fence)
        # Parity tests propagate from committed JEOD fixtures
        # (same regen path as tier3_), so $JEOD_HOME must be unset
        # exactly like the other test jobs.
        run: |
          if [ -n "${JEOD_HOME:-}" ] || [ -n "${JEOD_PATH:-}" ]; then
            echo "FATAL: JEOD_HOME / JEOD_PATH must be unset for the standalone-repo CI fence" >&2
            exit 1
          fi
      # All `bevy_parity_*` tests run here. The runner-vs-bevy
      # lockstep harness (see `crates/astrodyn_verif_parity/src/lib.rs`)
      # propagates each scenario twice for bit-identity, so the cost
      # profile matches Tier 3 trajectory runs. The file-stem naming
      # convention (every `#[test] fn` shares its file's stem) is
      # enforced by `crates/astrodyn_verif_parity/tests/parity_coverage.rs`.
      - name: Run bevy_parity_* tests
        run: cargo nextest run --workspace -E 'test(bevy_parity)'

  test-tier3:
    name: Test (Tier 3 fast)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Verify JEOD env vars are unset (regression fence)
        # #249/#239 finished migrating the run_verification/sim_*.rs
        # rigs to committed fixtures under crates/astrodyn_verif_jeod/test_data/jeod_inputs/ and
        # crates/astrodyn_gravity/test_data/gravity/. Tier 3 now runs without a JEOD checkout;
        # this fence catches any regression that re-introduces a
        # $JEOD_HOME read on the runtime path.
        run: |
          if [ -n "${JEOD_HOME:-}" ] || [ -n "${JEOD_PATH:-}" ]; then
            echo "FATAL: JEOD_HOME / JEOD_PATH must be unset for Tier 3 (#249/#239)" >&2
            exit 1
          fi
      - name: Run Tier 3 tests (exclude earth_moon ~17 min)
        # `bevy_parity_*` tests run in the dedicated `test-parity-trajectory`
        # job, so this filter is the plain Tier 3 prefix.
        run: cargo nextest run --workspace -E 'test(tier3_) and not test(earth_moon)'
      - name: Generate cross-validation report
        run: cargo run -p astrodyn_verif_jeod --bin tier3_report
      - name: Enforce Tier 3 baseline invariance
        run: cargo run -p astrodyn_verif_jeod --bin tier3_baseline_diff -- --allow-missing-from .github/tier3-allow-missing.txt
      - name: Upload cross-validation report
        uses: actions/upload-artifact@v4
        with:
          name: tier3-crossval-report
          path: target/tier3_report.md

  test-tier3-full:
    name: Test (Tier 3 full + earth_moon)
    if: github.ref == 'refs/heads/main'
    needs: test-tier3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Verify JEOD env vars are unset (regression fence)
        run: |
          if [ -n "${JEOD_HOME:-}" ] || [ -n "${JEOD_PATH:-}" ]; then
            echo "FATAL: JEOD_HOME / JEOD_PATH must be unset for Tier 3 (#249/#239)" >&2
            exit 1
          fi
      - name: Run all Tier 3 tests (including earth_moon)
        run: cargo nextest run --workspace -E 'test(tier3_)'
      - name: Generate cross-validation report
        run: cargo run -p astrodyn_verif_jeod --bin tier3_report
      - name: Enforce Tier 3 baseline invariance
        run: cargo run -p astrodyn_verif_jeod --bin tier3_baseline_diff -- --allow-missing-from .github/tier3-allow-missing.txt
      - name: Upload cross-validation report (full)
        uses: actions/upload-artifact@v4
        with:
          name: tier3-crossval-report-full
          path: target/tier3_report.md

  perf-microbench-smoke:
    name: Perf microbench smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run criterion benches in --quick mode
        # --quick takes ~10 samples per bench (~5s/bench × 3 benches +
        # build cost). We assert only that every bench compiles, runs,
        # and exits zero — no timing thresholds, runner variance makes
        # those flaky. The job catches "I broke the bench harness"
        # regressions cheaply.
        #
        # `--workspace -- --quick` doesn't work because cargo also
        # invokes the default cargo-test bench harness on every lib /
        # bin target, and those reject criterion's `--quick` flag. We
        # name each bench explicitly instead — three lines now, easy to
        # extend as the suite grows.
        run: |
          cargo bench -p astrodyn_gravity --bench accumulate \
                      -p astrodyn_dynamics --bench integration \
                      -p astrodyn_runner --bench step -- --quick

  perf-baseline-track:
    name: Perf baseline (main-only)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify JEOD env vars are unset (regression fence)
        run: |
          if [ -n "${JEOD_HOME:-}" ] || [ -n "${JEOD_PATH:-}" ]; then
            echo "FATAL: JEOD_HOME / JEOD_PATH must be unset" >&2
            exit 1
          fi
      - name: Download previous perf-history (best-effort)
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: ci.yml
          branch: main
          name: perf-history
          path: ./perf-history-prev
          if_no_artifact_found: warn
      - name: Build tier3_perf_runner (release-with-debug)
        run: |
          cargo build --profile release-with-debug \
                      -p astrodyn_verif_jeod --bin tier3_perf_runner
      - name: Run perf baseline
        run: |
          mkdir -p target/perf
          ./target/release-with-debug/tier3_perf_runner \
            --scenario earth_moon_clem \
            --steps 100000 --warmup 1000 --repeat 5 \
            --output target/perf/latest.json
          cat target/perf/latest.json
      - name: Append to perf-history.csv
        run: |
          set -eo pipefail
          HIST=target/perf/perf-history.csv
          if [ -f ./perf-history-prev/perf-history.csv ]; then
            cp ./perf-history-prev/perf-history.csv "$HIST"
          else
            echo "git_sha,scenario,steps,warmup,repeat,mean_secs,stdev_secs,per_step_us,max_rss_mb,timestamp" > "$HIST"
          fi
          jq -r --arg sha "${GITHUB_SHA::7}" --arg ts "$(date -u +%FT%TZ)" '
            [$sha, .scenario, .steps, .warmup, .repeat,
             .mean_secs, .stdev_secs, .per_step_us, .max_rss_mb, $ts] | @csv
          ' target/perf/latest.json >> "$HIST"
          echo "--- last 10 perf-history.csv rows ---"
          tail -n 10 "$HIST"
      - name: Upload perf-history artifact
        uses: actions/upload-artifact@v4
        with:
          name: perf-history
          path: target/perf/perf-history.csv
          # 365-day retention pushes the first artifact aging out well
          # past the issue's "≥ 5 entries" criterion. Migrate to
          # `gh-pages` or an external store before the first run ages
          # out (track as a follow-on issue).
          retention-days: 365
      - name: Post commit status (informational, never failing)
        # Always green — this surface is informational, not gating.
        # Failures from `gh api` (network blip, etc) are non-fatal.
        run: |
          MEAN=$(jq -r .mean_secs target/perf/latest.json)
          PER=$(jq -r .per_step_us target/perf/latest.json)
          gh api repos/${{ github.repository }}/statuses/${{ github.sha }} \
            -f state=success \
            -f context="perf/earth_moon_clem" \
            -f description="mean=${MEAN}s per_step=${PER}us" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" || true
        env:
          GH_TOKEN: ${{ github.token }}

  runtime-budget:
    name: Runtime budget (envelope)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Verify JEOD env vars are unset (regression fence)
        run: |
          if [ -n "${JEOD_HOME:-}" ] || [ -n "${JEOD_PATH:-}" ]; then
            echo "FATAL: JEOD_HOME / JEOD_PATH must be unset" >&2
            exit 1
          fi
      - name: Measure earth_moon Tier 3 wall time
        # Mirrors `compile-time-budget`'s envelope-only philosophy. The
        # 1500 s budget sits comfortably above the current ~17 min
        # observed runtime (#447's first-pass perf investigation). If a
        # change pushes the test past 25 min, the test still PASSes but
        # this job fails — flagging a regression without false-positive
        # noise from runner variance.
        #
        # WSL2 development hosts observe ~26 min on the same test; if
        # the GitHub runner profile drifts toward WSL2-like cost,
        # raise the budget rather than papering over a regression.
        run: |
          set -eo pipefail
          start=$(date +%s)
          cargo nextest run --workspace -E 'test(tier3_simulation_earth_moon_clem)'
          end=$(date +%s)
          DURATION=$((end - start))
          echo "tier3_simulation_earth_moon_clem took ${DURATION}s (budget: 1500s = 25 min)"
          if [ "$DURATION" -ge 1500 ]; then
            echo "::error::runtime budget exceeded: ${DURATION}s >= 1500s"
            exit 1
          fi
