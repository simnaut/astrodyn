name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --tests --examples -- -D warnings -D deprecated
      - name: Escape-hatch grep guard
        run: scripts/check_no_escape_hatches.sh
      - name: Gateway-bypass dep guard (#390)
        run: scripts/check_no_bypass_deps.sh

  test-examples:
    name: Smoke run examples
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p astrodyn_bevy --example kepler_orbit -- --steps 10
      - run: cargo run -p astrodyn_bevy --example typed_mission -- --steps 10

  test-quantities:
    name: Test (astrodyn_quantities)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run -p astrodyn_quantities

  docs-enforce:
    name: Docs (rustdoc -D warnings + doctests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build workspace docs (public + private, deny warnings)
        # `--document-private-items` surfaces broken intra-doc links and
        # invalid HTML tags inside private items (`fn`, `struct`, fields).
        # The workspace's [workspace.lints.rustdoc] table already denies
        # these; running the strict-warnings build keeps drift from landing.
        run: cargo doc --workspace --no-deps --document-private-items --quiet
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Run workspace doctests
        run: cargo test --doc --workspace

  compile-time-budget:
    name: Compile-time budget (envelope)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Measure cold workspace check time
        run: |
          # pipefail so a failed `cargo check` makes the step fail rather than
          # being masked by `tee`'s exit code (GH Actions' default bash has
          # neither pipefail nor errexit on by default).
          set -eo pipefail
          # Ensure a fresh workspace build even if rust-cache restored target artifacts;
          # the budget is meant to track cold compile time, not warm re-check time.
          cargo clean
          # Measure wall clock ourselves — cargo prints "in 1m 23s" once the time
          # crosses 60s, so parsing "in Ns" from cargo output breaks right when
          # we'd care. `date +%s` is robust regardless of cargo's format.
          start=$(date +%s)
          cargo check --workspace --timings 2>&1 | tee check.log
          end=$(date +%s)
          DURATION=$((end - start))
          echo "cargo check --workspace took ${DURATION}s (budget: 300s envelope for Phase 0 of #101)"
          # Hard fail only if grossly over budget; Phase 0 is envelope-only.
          if [ "$DURATION" -ge 300 ]; then
            echo "::error::compile-time budget exceeded: ${DURATION}s >= 300s"
            exit 1
          fi

  test:
    name: Test (unit + tier 2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Verify JEOD env vars are unset (regression fence)
        run: |
          if [ -n "${JEOD_HOME:-}" ] || [ -n "${JEOD_PATH:-}" ]; then
            echo "FATAL: JEOD_HOME / JEOD_PATH must be unset for the standalone-repo CI fence" >&2
            exit 1
          fi
      - name: Run tests (skip Tier 3 trajectory validation)
        run: cargo nextest run --workspace -E 'not test(tier3_)'

  test-tier3:
    name: Test (Tier 3 fast)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Verify JEOD env vars are unset (regression fence)
        # #249/#239 finished migrating the run_verification/sim_*.rs
        # rigs to committed fixtures under crates/astrodyn_verif_jeod/test_data/jeod_inputs/ and
        # crates/astrodyn_gravity/test_data/gravity/. Tier 3 now runs without a JEOD checkout;
        # this fence catches any regression that re-introduces a
        # $JEOD_HOME read on the runtime path.
        run: |
          if [ -n "${JEOD_HOME:-}" ] || [ -n "${JEOD_PATH:-}" ]; then
            echo "FATAL: JEOD_HOME / JEOD_PATH must be unset for Tier 3 (#249/#239)" >&2
            exit 1
          fi
      - name: Run Tier 3 tests (exclude earth_moon ~17 min)
        run: cargo nextest run --workspace -E 'test(tier3_) and not test(earth_moon)'
      - name: Generate cross-validation report
        run: cargo run -p astrodyn_verif_jeod --bin tier3_report
      - name: Enforce Tier 3 baseline invariance
        run: cargo run -p astrodyn_verif_jeod --bin tier3_baseline_diff -- --allow-missing-from .github/tier3-allow-missing.txt
      - name: Upload cross-validation report
        uses: actions/upload-artifact@v4
        with:
          name: tier3-crossval-report
          path: target/tier3_report.md

  test-tier3-full:
    name: Test (Tier 3 full + earth_moon)
    if: github.ref == 'refs/heads/main'
    needs: test-tier3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Verify JEOD env vars are unset (regression fence)
        run: |
          if [ -n "${JEOD_HOME:-}" ] || [ -n "${JEOD_PATH:-}" ]; then
            echo "FATAL: JEOD_HOME / JEOD_PATH must be unset for Tier 3 (#249/#239)" >&2
            exit 1
          fi
      - name: Run all Tier 3 tests (including earth_moon)
        run: cargo nextest run --workspace -E 'test(tier3_)'
      - name: Generate cross-validation report
        run: cargo run -p astrodyn_verif_jeod --bin tier3_report
      - name: Enforce Tier 3 baseline invariance
        run: cargo run -p astrodyn_verif_jeod --bin tier3_baseline_diff -- --allow-missing-from .github/tier3-allow-missing.txt
      - name: Upload cross-validation report (full)
        uses: actions/upload-artifact@v4
        with:
          name: tier3-crossval-report-full
          path: target/tier3_report.md
