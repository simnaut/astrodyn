name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --tests --examples -- -D warnings -D deprecated
      - name: Escape-hatch grep guard
        run: scripts/check_no_escape_hatches.sh

  test-quantities:
    name: Test (jeod_quantities)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run -p jeod_quantities

  compile-time-budget:
    name: Compile-time budget (envelope)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Measure cold workspace check time
        run: |
          # pipefail so a failed `cargo check` makes the step fail rather than
          # being masked by `tee`'s exit code (GH Actions' default bash has
          # neither pipefail nor errexit on by default).
          set -eo pipefail
          # Ensure a fresh workspace build even if rust-cache restored target artifacts;
          # the budget is meant to track cold compile time, not warm re-check time.
          cargo clean
          # Measure wall clock ourselves — cargo prints "in 1m 23s" once the time
          # crosses 60s, so parsing "in Ns" from cargo output breaks right when
          # we'd care. `date +%s` is robust regardless of cargo's format.
          start=$(date +%s)
          cargo check --workspace --timings 2>&1 | tee check.log
          end=$(date +%s)
          DURATION=$((end - start))
          echo "cargo check --workspace took ${DURATION}s (budget: 300s envelope for Phase 0 of #101)"
          # Hard fail only if grossly over budget; Phase 0 is envelope-only.
          if [ "$DURATION" -ge 300 ]; then
            echo "::error::compile-time budget exceeded: ${DURATION}s >= 300s"
            exit 1
          fi

  test:
    name: Test (unit + tier 2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Sparse checkout JEOD reference data
        run: |
          JEOD_TAG=jeod_v5.4.0
          JEOD_SHA=27893108bbde8bb162b3213a30d57af89acd1c76
          git clone --no-checkout --depth 1 --branch "$JEOD_TAG" \
            https://github.com/nasa/jeod.git ../jeod
          cd ../jeod
          # Verify immutable tag hasn't moved
          [ "$(git rev-parse HEAD)" = "$JEOD_SHA" ] || \
            { echo "FATAL: $JEOD_TAG resolved to $(git rev-parse HEAD), expected $JEOD_SHA"; exit 1; }
          git sparse-checkout set \
            models/environment/gravity/data \
            models/environment/gravity/verif/unit_tests/grav_geospherical/data \
            models/environment/time/data \
            models/dynamics/body_action/verif/SIM_orbinit/Modified_data \
            models/dynamics/derived_state/verif/unit_tests \
            models/utils/orbital_elements/verif/SIM_orb_elem/Modified_data
          git checkout
      - uses: taiki-e/install-action@nextest
      - name: Run tests (skip Tier 3 trajectory validation)
        env:
          JEOD_HOME: ${{ github.workspace }}/../jeod
        run: cargo nextest run --workspace -E 'not test(tier3_)'

  test-tier3:
    name: Test (Tier 3 fast)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Sparse checkout JEOD reference data
        run: |
          JEOD_TAG=jeod_v5.4.0
          JEOD_SHA=27893108bbde8bb162b3213a30d57af89acd1c76
          git clone --no-checkout --depth 1 --branch "$JEOD_TAG" \
            https://github.com/nasa/jeod.git ../jeod
          cd ../jeod
          [ "$(git rev-parse HEAD)" = "$JEOD_SHA" ] || \
            { echo "FATAL: $JEOD_TAG resolved to $(git rev-parse HEAD), expected $JEOD_SHA"; exit 1; }
          git sparse-checkout set \
            models/environment/gravity/data \
            models/environment/gravity/verif/unit_tests/grav_geospherical/data \
            models/environment/time/data \
            models/dynamics/body_action/verif/SIM_orbinit/Modified_data \
            models/dynamics/derived_state/verif \
            models/interactions/radiation_pressure/verif/SIM_3_ORBIT \
            models/interactions/radiation_pressure/verif/SIM_3_ORBIT_1st_ORDER \
            models/interactions/radiation_pressure/verif/SIM_2A_SHADOW_CALC \
            models/environment/time/verif/SIM_7_time_reversal \
            models/utils/orbital_elements/verif/SIM_orb_elem/Modified_data \
            verif/SIM_dyncomp
          git checkout
      - uses: taiki-e/install-action@nextest
      - name: Run Tier 3 tests (exclude earth_moon ~17 min)
        env:
          JEOD_HOME: ${{ github.workspace }}/../jeod
        run: cargo nextest run --workspace -E 'test(tier3_) and not test(earth_moon)'
      - name: Generate cross-validation report
        run: cargo run -p jeod_test_data --bin tier3_report
      - name: Enforce Tier 3 baseline invariance
        run: cargo run -p jeod_test_data --bin tier3_baseline_diff -- --allow-missing tier3_earth_moon_clem
      - name: Upload cross-validation report
        uses: actions/upload-artifact@v4
        with:
          name: tier3-crossval-report
          path: target/tier3_report.md

  test-tier3-full:
    name: Test (Tier 3 full + earth_moon)
    if: github.ref == 'refs/heads/main'
    needs: test-tier3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Sparse checkout JEOD reference data
        run: |
          JEOD_TAG=jeod_v5.4.0
          JEOD_SHA=27893108bbde8bb162b3213a30d57af89acd1c76
          git clone --no-checkout --depth 1 --branch "$JEOD_TAG" \
            https://github.com/nasa/jeod.git ../jeod
          cd ../jeod
          [ "$(git rev-parse HEAD)" = "$JEOD_SHA" ] || \
            { echo "FATAL: $JEOD_TAG resolved to $(git rev-parse HEAD), expected $JEOD_SHA"; exit 1; }
          git sparse-checkout set \
            models/environment/gravity/data \
            models/environment/gravity/verif/unit_tests/grav_geospherical/data \
            models/environment/time/data \
            models/dynamics/body_action/verif/SIM_orbinit/Modified_data \
            models/dynamics/derived_state/verif \
            models/interactions/radiation_pressure/verif/SIM_3_ORBIT \
            models/interactions/radiation_pressure/verif/SIM_3_ORBIT_1st_ORDER \
            models/interactions/radiation_pressure/verif/SIM_2A_SHADOW_CALC \
            models/environment/time/verif/SIM_7_time_reversal \
            models/utils/orbital_elements/verif/SIM_orb_elem/Modified_data \
            verif/SIM_dyncomp
          git checkout
      - uses: taiki-e/install-action@nextest
      - name: Run all Tier 3 tests (including earth_moon)
        env:
          JEOD_HOME: ${{ github.workspace }}/../jeod
        run: cargo nextest run --workspace -E 'test(tier3_)'
      - name: Generate cross-validation report
        run: cargo run -p jeod_test_data --bin tier3_report
      - name: Enforce Tier 3 baseline invariance
        run: cargo run -p jeod_test_data --bin tier3_baseline_diff
      - name: Upload cross-validation report (full)
        uses: actions/upload-artifact@v4
        with:
          name: tier3-crossval-report-full
          path: target/tier3_report.md
