name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on PR branches so rapid-fire pushes don't burn double
# minutes through the test matrix. The expression gates `cancel-in-progress`
# on the ref so a push to main never cancels an in-flight `test-tier3-full`,
# `test-parity-trajectory-full`, or `perf-baseline-track` run — those are
# main-only and produce the artifacts (perf-history, Tier 3 cross-val report)
# the project relies on.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # Tier 3 / parity panics emit only the panic line by default; this flag
  # turns every panicking test into a usable stack trace without per-step
  # opt-in. Cheap and uniformly applied — the rust toolchain reads
  # `RUST_BACKTRACE` from the environment regardless of which `cargo` /
  # `nextest` invocation drove the test.
  RUST_BACKTRACE: 1

jobs:
  changes:
    # Docs-only gate. Every job below skips when a PR touches nothing
    # that can affect a build, test, or guard script — e.g. a root
    # README/CHANGELOG edit or a `.claude/` agent-config change. Before
    # this gate, such a PR burned the full matrix (Tier 3, parity, the
    # ~37 min earth_moon runtime-budget envelope) on prose.
    #
    # Job-level gating, deliberately NOT `on.pull_request.paths-ignore`:
    # the "protect main" ruleset names seven jobs in this workflow as
    # required status checks, and a workflow that never triggers leaves
    # its required checks pending forever — the PR can't merge. A job
    # skipped by an `if:` conditional reports success to branch
    # protection, so docs-only PRs merge cleanly.
    #
    # `code` matches any changed file OUTSIDE the curated safe-set. The
    # safe-set is deliberately tight — root-level prose, `.claude/**`,
    # `.gitignore`, license texts — because several .md files are
    # load-bearing and must keep running the full matrix:
    #   - docs/JEOD_invariants.md — parsed by tests/invariant_coverage.rs
    #   - crates/astrodyn_bevy/README.md — include_str!'d into rustdoc,
    #     so its code blocks execute as doctests in `docs-enforce`
    #   - crates/**/README.md generally — kept in the code set so a
    #     future `#![doc = include_str!(...)]` can't silently fall
    #     outside the gate
    #
    # Push-to-main short-circuits to code=true: the main-only artifact
    # lanes (perf-history, Tier 3 cross-val report) stay per-commit, and
    # the merged result of a docs-only PR still gets one full run.
    #
    # Fail-closed: a paths-filter error (API hiccup, rate limit) must
    # not skip CI — skipped satisfies required checks, so a gate error
    # would otherwise leave the PR mergeable untested. The filter step
    # is `continue-on-error` and the outputs expression treats any
    # non-success step outcome as code=true: a broken gate runs the
    # full matrix, never none of it. Residual corner: a runner-level
    # failure of this JOB (not the step) still skips dependents; once
    # this gate lands on main, add "Changed-paths gate" to the
    # ruleset's required checks to cover that. (Adding it before merge
    # would hang every open PR on a check absent from their runs.)
    name: Changed-paths gate
    runs-on: ubuntu-latest
    # `permissions:` replaces the default token scopes; paths-filter
    # only needs the PR file listing (no checkout on pull_request
    # events — it reads the files via the API).
    permissions:
      pull-requests: read
    outputs:
      # Three clauses, in order: push-to-main always runs everything;
      # a failed/errored filter step fails closed to code=true; an
      # actual filter verdict is honored.
      code: ${{ github.event_name != 'pull_request' || steps.filter.outcome != 'success' || steps.filter.outputs.code == 'true' }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        # Fail closed (see job comment): if this step errors, the job
        # still succeeds and the outputs expression defaults to
        # code=true — full matrix, not zero matrix.
        continue-on-error: true
        with:
          # 'every' is load-bearing: with the default quantifier
          # ('some'), a file matches the filter if ANY pattern matches,
          # and '**' matches everything — the '!' exclusions would be
          # silently ignored and every PR would count as code (gate
          # permanently open, full matrix on prose). With 'every', a
          # file is code iff it matches '**' AND each negated pattern,
          # i.e. iff it falls outside the safe-set. See "How to use"
          # → predicate-quantifier in the paths-filter README.
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!*.md'
              - '!.claude/**'
              - '!.gitignore'
              - '!LICENSE-*'
              - '!crates/*/LICENSE-*'

  check:
    name: Lint & Format
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --tests --examples -- -D warnings -D deprecated
      - name: Escape-hatch grep guard
        run: scripts/check_no_escape_hatches.sh
      - name: Gateway-bypass dep guard (#390)
        run: scripts/check_no_bypass_deps.sh
      - name: Silent-warn fail-loudly guard (#485 T1)
        run: scripts/check_no_silent_warn.sh
      - name: Tier 3 baseline-widening guard
        # Diffs `crates/astrodyn_verif_jeod/test_data/baselines.json`
        # against `origin/main` and surfaces per-component widenings
        # bucketed as notice / warning / error. Closes the discipline
        # gap that `tier3_baseline_diff.rs` cannot detect — that tool
        # compares the *current run* to the *baseline file in the PR
        # branch*, so a PR that also edits the baseline is
        # self-consistent. This static diff is the structural fence on
        # the file itself.
        run: |
          # Fetch the base branch tip so `git show origin/main:...`
          # resolves even on a shallow PR checkout.
          git fetch --no-tags --depth=1 origin main
          scripts/check_baseline_widening.sh

  test-examples:
    name: Smoke run examples
    needs: [changes, check]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p astrodyn_bevy --example kepler_orbit -- --steps 10
      - run: cargo run -p astrodyn_bevy --example typed_mission -- --steps 10

  test-quantities:
    name: Test (astrodyn_quantities)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run -p astrodyn_quantities

  docs-enforce:
    name: Docs (rustdoc -D warnings + doctests)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build workspace docs (public + private, deny warnings)
        # `--document-private-items` surfaces broken intra-doc links and
        # invalid HTML tags inside private items (`fn`, `struct`, fields).
        # The workspace's [workspace.lints.rustdoc] table already denies
        # these; running the strict-warnings build keeps drift from landing.
        run: cargo doc --workspace --no-deps --document-private-items --quiet
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Build feature-gated frame-doc docs (deny warnings)
        # `cargo doc --workspace` builds with default features, so the
        # non-default `frame-doc` modules (`astrodyn::frame_doc_io`, the
        # runner's and the Bevy adapter's document export/apply) are cfg'd
        # out of the pass above. Build them explicitly so their rustdoc is
        # `-D warnings`-checked.
        run: cargo doc -p astrodyn -p astrodyn_runner -p astrodyn_bevy --features astrodyn/frame-doc,astrodyn_runner/frame-doc,astrodyn_bevy/frame-doc --no-deps --document-private-items --quiet
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Run workspace doctests
        run: cargo test --doc --workspace

  compile-time-budget:
    name: Compile-time budget (envelope)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Measure cold workspace check time
        run: |
          # pipefail so a failed `cargo check` makes the step fail rather than
          # being masked by `tee`'s exit code (GH Actions' default bash has
          # neither pipefail nor errexit on by default).
          set -eo pipefail
          # Ensure a fresh workspace build even if rust-cache restored target artifacts;
          # the budget is meant to track cold compile time, not warm re-check time.
          cargo clean
          # Measure wall clock ourselves — cargo prints "in 1m 23s" once the time
          # crosses 60s, so parsing "in Ns" from cargo output breaks right when
          # we'd care. `date +%s` is robust regardless of cargo's format.
          start=$(date +%s)
          cargo check --workspace --timings 2>&1 | tee check.log
          end=$(date +%s)
          DURATION=$((end - start))
          echo "cargo check --workspace took ${DURATION}s (budget: 300s envelope for Phase 0 of #101)"
          # Hard fail only if grossly over budget; Phase 0 is envelope-only.
          if [ "$DURATION" -ge 300 ]; then
            echo "::error::compile-time budget exceeded: ${DURATION}s >= 300s"
            exit 1
          fi

  test:
    name: Test (unit + tier 2)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Verify JEOD env vars are unset (regression fence)
        run: |
          if [ -n "${JEOD_HOME:-}" ] || [ -n "${JEOD_PATH:-}" ]; then
            echo "FATAL: JEOD_HOME / JEOD_PATH must be unset for the standalone-repo CI fence" >&2
            exit 1
          fi
      # The `bevy_parity_*` tests share the Tier 3 cost profile: each
      # parity wrapper runs the same scenario through `astrodyn_runner`
      # and `astrodyn_bevy` in lockstep, so the runtime cost is
      # comparable to a Tier 3 trajectory run. They run in the
      # dedicated `test-parity-trajectory` job below to keep this
      # unit/Tier-2 lane fast.
      - name: Run tests (skip Tier 3 trajectory validation and bevy parity)
        run: cargo nextest run --workspace -E 'not test(tier3_) and not test(bevy_parity)'

  test-parity-trajectory:
    name: Test (parity trajectory fast)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Verify JEOD env vars are unset (regression fence)
        # Parity tests propagate from committed JEOD fixtures
        # (same regen path as tier3_), so $JEOD_HOME must be unset
        # exactly like the other test jobs.
        run: |
          if [ -n "${JEOD_HOME:-}" ] || [ -n "${JEOD_PATH:-}" ]; then
            echo "FATAL: JEOD_HOME / JEOD_PATH must be unset for the standalone-repo CI fence" >&2
            exit 1
          fi
      # All `bevy_parity_*` tests run here, MINUS a slow subset that
      # is deferred to the main-branch `test-parity-trajectory-full`
      # job below. The runner-vs-bevy lockstep harness (see
      # `crates/astrodyn_verif_parity/src/lib.rs`) propagates each
      # scenario twice for bit-identity, so the cost profile matches
      # Tier 3 trajectory runs.
      #
      # The exclusion list below mirrors the `not test(earth_moon)`
      # filter on `test-tier3`: drop the few heaviest binaries on PRs
      # to keep this lane fast, then re-run everything on main. The
      # excluded binaries account for ~80% of release-build CPU time
      # measured on commit 97231b3 (see PR introducing this split for
      # the per-binary timing table). Dropping them takes a ~45-60 min
      # PR job to ~10-12 min; full coverage still gates merges to main
      # through `test-parity-trajectory-full`.
      #
      # When adding a new heavy parity binary that bloats this lane,
      # extend both this exclusion and the
      # `test-parity-trajectory-full` job's matching comment so the
      # full-coverage invariant stays explicit.
      #
      # Note: the `binary(...)` selectors below read the cargo target
      # name (one binary per `tests/bevy_parity_*.rs` file). This is the
      # second of the two structural fences cataloged in
      # `crates/astrodyn_verif_parity/tests/parity_coverage.rs` §"Structural
      # coupling". If `tests/bevy_parity_*.rs` were ever collapsed under
      # one umbrella binary named `bevy_parity` (e.g. mod-based
      # restructure), the four binary selectors below (two
      # `binary(/^bevy_parity_…/)` regexes plus two exact-match
      # `binary(=bevy_parity_…)` selectors) would each match zero
      # binaries — both forms require the trailing `_<topic>` suffix
      # that the umbrella target name lacks, so nothing gets excluded
      # and the PR lane silently runs every heavy parity scenario.
      # The `parity_coverage.rs` module doc enumerates the parallel
      # guard fence.
      - name: Run fast bevy_parity_* tests (exclude heavy binaries)
        run: |
          cargo nextest run --workspace -E '
            test(bevy_parity) and not (
              binary(/^bevy_parity_dyncomp_run/)
              or binary(/^bevy_parity_solar_beta/)
              or binary(=bevy_parity_torque_simple)
              or binary(=bevy_parity_srp_1st_order)
            )
          '

  test-parity-trajectory-full:
    name: Test (parity trajectory full)
    if: github.ref == 'refs/heads/main'
    needs: test-parity-trajectory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Verify JEOD env vars are unset (regression fence)
        run: |
          if [ -n "${JEOD_HOME:-}" ] || [ -n "${JEOD_PATH:-}" ]; then
            echo "FATAL: JEOD_HOME / JEOD_PATH must be unset for the standalone-repo CI fence" >&2
            exit 1
          fi
      # Full bevy_parity_* coverage, including the slow binaries that
      # `test-parity-trajectory` excludes on PRs (dyncomp_run*,
      # solar_beta + solar_beta_edge, torque_simple, srp_1st_order).
      # This lane only runs on push to main, mirroring the
      # `test-tier3-full` job's role for the `earth_moon` Tier 3 test.
      - name: Run all bevy_parity_* tests
        run: cargo nextest run --workspace -E 'test(bevy_parity)'

  schedule-audit:
    # Regression fence on Bevy schedule ambiguities. The
    # `astrodyn_bevy/schedule_audit` feature configures every
    # `AstrodynPlugin`-touched schedule with
    # `ScheduleBuildSettings { ambiguity_detection: LogLevel::Error, .. }`,
    # so any pair of systems with conflicting component / resource access
    # and no explicit `.before` / `.after` / `.ambiguous_with` edge
    # panics on App build. The job exercises that gate against every
    # example (one App build per example) and every `astrodyn_bevy` unit
    # test (each `App::new()` site re-validates). Issue #562 introduced
    # the feature; future PRs that add a system without an ordering
    # edge fail loudly here instead of producing intermittent ULP drift
    # at runtime.
    #
    # Examples cover the single-planet (Earth) and multi-planet
    # (Earth + Moon + Sun) registration paths. `cargo nextest`
    # exercises the unit-test App-build sites.
    name: Schedule ambiguity audit (LogLevel::Error)
    needs: [changes, check]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Smoke-run examples under schedule_audit
        run: |
          cargo run -p astrodyn_bevy --features schedule_audit --example kepler_orbit -- --steps 1
          cargo run -p astrodyn_bevy --features schedule_audit --example typed_mission -- --steps 1
          cargo run -p astrodyn_bevy --features schedule_audit --example multi_body_scenario -- --steps 1
      - name: Run astrodyn_bevy unit tests under schedule_audit
        run: cargo nextest run -p astrodyn_bevy --features schedule_audit

  test-tier3:
    name: Test (Tier 3 fast)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Verify JEOD env vars are unset (regression fence)
        # #249/#239 finished migrating the run_verification/sim_*.rs
        # rigs to committed fixtures under crates/astrodyn_verif_jeod/test_data/jeod_inputs/ and
        # crates/astrodyn_gravity/test_data/gravity/. Tier 3 now runs without a JEOD checkout;
        # this fence catches any regression that re-introduces a
        # $JEOD_HOME read on the runtime path.
        run: |
          if [ -n "${JEOD_HOME:-}" ] || [ -n "${JEOD_PATH:-}" ]; then
            echo "FATAL: JEOD_HOME / JEOD_PATH must be unset for Tier 3 (#249/#239)" >&2
            exit 1
          fi
      - name: Run Tier 3 tests (exclude earth_moon ~17 min)
        # `bevy_parity_*` tests run in the dedicated `test-parity-trajectory`
        # job, so this filter is the plain Tier 3 prefix.
        run: cargo nextest run --workspace -E 'test(tier3_) and not test(earth_moon)'
      - name: Generate cross-validation report
        run: cargo run -p astrodyn_verif_jeod --bin tier3_report
      - name: Enforce Tier 3 baseline invariance
        run: cargo run -p astrodyn_verif_jeod --bin tier3_baseline_diff -- --allow-missing-from .github/tier3-allow-missing.txt
      - name: Upload cross-validation report
        uses: actions/upload-artifact@v7
        with:
          name: tier3-crossval-report
          path: target/tier3_report.md

  test-tier3-full:
    name: Test (Tier 3 full + earth_moon)
    if: github.ref == 'refs/heads/main'
    needs: test-tier3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Verify JEOD env vars are unset (regression fence)
        run: |
          if [ -n "${JEOD_HOME:-}" ] || [ -n "${JEOD_PATH:-}" ]; then
            echo "FATAL: JEOD_HOME / JEOD_PATH must be unset for Tier 3 (#249/#239)" >&2
            exit 1
          fi
      - name: Run all Tier 3 tests (including earth_moon)
        run: cargo nextest run --workspace -E 'test(tier3_)'
      - name: Generate cross-validation report
        run: cargo run -p astrodyn_verif_jeod --bin tier3_report
      - name: Enforce Tier 3 baseline invariance
        run: cargo run -p astrodyn_verif_jeod --bin tier3_baseline_diff -- --allow-missing-from .github/tier3-allow-missing.txt
      - name: Upload cross-validation report (full)
        uses: actions/upload-artifact@v7
        with:
          name: tier3-crossval-report-full
          path: target/tier3_report.md

  perf-microbench-smoke:
    name: Perf microbench smoke
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run criterion benches in --quick mode
        # --quick takes ~10 samples per bench (~5s/bench × 3 benches +
        # build cost). We assert only that every bench compiles, runs,
        # and exits zero — no timing thresholds, runner variance makes
        # those flaky. The job catches "I broke the bench harness"
        # regressions cheaply.
        #
        # `--noplot` disables criterion's HTML/plot report generation.
        # The smoke job only needs build/run/exit-0, and the plot renderer
        # (plotters PDF/KDE) panics on certain degenerate sample
        # distributions that --quick's ~10 samples can produce — a flake
        # unrelated to the code under test. See #654.
        #
        # `--workspace -- --quick` doesn't work because cargo also
        # invokes the default cargo-test bench harness on every lib /
        # bin target, and those reject criterion's `--quick` flag. We
        # name each bench explicitly instead — three lines now, easy to
        # extend as the suite grows.
        run: |
          cargo bench -p astrodyn_gravity --bench accumulate \
                      -p astrodyn_gravity --bench integration \
                      -p astrodyn_verif_jeod --bench step -- --quick --noplot

  perf-baseline-track:
    name: Perf baseline (main-only)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # `permissions:` overrides the workflow default, so every scope the
    # job's steps need must be listed explicitly. `contents: read` lets
    # `actions/checkout` fetch the repo; `actions: read` lets the
    # artifact-download step pull the previous perf-history artifact;
    # `statuses: write` lets the final step post the commit-status
    # baseline-delta.
    permissions:
      contents: read
      actions: read
      statuses: write
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify JEOD env vars are unset (regression fence)
        run: |
          if [ -n "${JEOD_HOME:-}" ] || [ -n "${JEOD_PATH:-}" ]; then
            echo "FATAL: JEOD_HOME / JEOD_PATH must be unset" >&2
            exit 1
          fi
      - name: Download previous perf-history (best-effort)
        uses: dawidd6/action-download-artifact@v21
        with:
          workflow: ci.yml
          branch: main
          name: perf-history
          path: ./perf-history-prev
          if_no_artifact_found: warn
      - name: Build tier3_perf_runner (release-with-debug)
        run: |
          cargo build --profile release-with-debug \
                      -p astrodyn_verif_jeod --bin tier3_perf_runner
      - name: Run perf baseline
        run: |
          mkdir -p target/perf
          ./target/release-with-debug/tier3_perf_runner \
            --scenario earth_moon_clem \
            --steps 100000 --warmup 1000 --repeat 5 \
            --output target/perf/latest.json
          cat target/perf/latest.json
      - name: Append to perf-history.csv
        run: |
          set -eo pipefail
          HIST=target/perf/perf-history.csv
          if [ -f ./perf-history-prev/perf-history.csv ]; then
            cp ./perf-history-prev/perf-history.csv "$HIST"
          else
            echo "git_sha,scenario,steps,warmup,repeat,mean_secs,stdev_secs,per_step_us,max_rss_mb,timestamp" > "$HIST"
          fi
          jq -r --arg sha "${GITHUB_SHA::7}" --arg ts "$(date -u +%FT%TZ)" '
            [$sha, .scenario, .steps, .warmup, .repeat,
             .mean_secs, .stdev_secs, .per_step_us, .max_rss_mb, $ts] | @csv
          ' target/perf/latest.json >> "$HIST"
          echo "--- last 10 perf-history.csv rows ---"
          tail -n 10 "$HIST"
      - name: Upload perf-history artifact
        uses: actions/upload-artifact@v7
        with:
          name: perf-history
          path: target/perf/perf-history.csv
          # 365-day retention pushes the first artifact aging out well
          # past the issue's "≥ 5 entries" criterion. Migrate to
          # `gh-pages` or an external store before the first run ages
          # out (track as a follow-on issue).
          retention-days: 365
      - name: Post commit status (informational, never failing)
        # Always green — this surface is informational, not gating.
        # Failures from `gh api` (network blip, etc) are non-fatal.
        run: |
          MEAN=$(jq -r .mean_secs target/perf/latest.json)
          PER=$(jq -r .per_step_us target/perf/latest.json)
          gh api repos/${{ github.repository }}/statuses/${{ github.sha }} \
            -f state=success \
            -f context="perf/earth_moon_clem" \
            -f description="mean=${MEAN}s per_step=${PER}us" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" || true
        env:
          GH_TOKEN: ${{ github.token }}

  runtime-budget:
    name: Runtime budget (envelope)
    # Main-only: the earth_moon envelope is a ~37-min job (see the `changes`
    # job comment above and the measurement step below) — too slow to gate
    # every PR. It runs post-merge on `main`, mirroring `perf-baseline-track`.
    # On PRs the job is skipped (reports "skipping") and does not block; a
    # regression that blows the envelope is caught on the merge commit.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Verify JEOD env vars are unset (regression fence)
        run: |
          if [ -n "${JEOD_HOME:-}" ] || [ -n "${JEOD_PATH:-}" ]; then
            echo "FATAL: JEOD_HOME / JEOD_PATH must be unset" >&2
            exit 1
          fi
      - name: Measure earth_moon Tier 3 wall time
        # Mirrors `compile-time-budget`'s envelope-only philosophy. The
        # measured window is `cargo nextest run` end-to-end on a cold
        # GitHub-runner cache: cargo network/index work + workspace
        # compile + the actual `tier3_simulation_earth_moon_clem`
        # propagation (~30 min steady-state). Observed wall-clock is
        # ~2200 s; the 3000 s budget sits ~35% above that for cold-cache
        # variance. A change pushing the job past 50 min fails this
        # envelope without false-positive noise from runner jitter.
        #
        # If GitHub's runner profile drifts (faster or slower) such
        # that the observed baseline moves outside [60%, 90%] of the
        # budget, refresh both the observation and the budget rather
        # than papering over a regression.
        run: |
          set -eo pipefail
          start=$(date +%s)
          cargo nextest run --workspace -E 'test(tier3_simulation_earth_moon_clem)'
          end=$(date +%s)
          DURATION=$((end - start))
          echo "tier3_simulation_earth_moon_clem took ${DURATION}s (budget: 3000s = 50 min)"
          if [ "$DURATION" -ge 3000 ]; then
            echo "::error::runtime budget exceeded: ${DURATION}s >= 3000s"
            exit 1
          fi
