[package]
name = "bevy_jeod"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy_jeod_dynamics = { path = "crates/bevy_jeod_dynamics" }
bevy_jeod_gravity = { path = "crates/bevy_jeod_gravity" }
bevy_jeod_frames = { path = "crates/bevy_jeod_frames" }
bevy_jeod_time = { path = "crates/bevy_jeod_time" }
bevy_jeod_ephemeris = { path = "crates/bevy_jeod_ephemeris" }
bevy_jeod_planet = { path = "crates/bevy_jeod_planet" }
jeod_math = { path = "crates/jeod_math", default-features = false }
jeod_dynamics = { path = "crates/jeod_dynamics", default-features = false }
jeod_gravity = { path = "crates/jeod_gravity", default-features = false }
jeod_frames = { path = "crates/jeod_frames" }
jeod_planet = { path = "crates/jeod_planet" }
jeod_time = { path = "crates/jeod_time", default-features = false }
jeod_ephemeris = { path = "crates/jeod_ephemeris" }
bevy = { workspace = true }

[features]
default = ["jeod-validation"]
jeod-validation = [
    "jeod_math/jeod-validation",
    "jeod_gravity/jeod-validation",
    "jeod_dynamics/jeod-validation",
    "jeod_time/jeod-validation",
]

[dev-dependencies]
jeod_test_data = { path = "crates/jeod_test_data" }

[workspace]
resolver = "2"
members = [
    "crates/jeod_math",
    "crates/jeod_dynamics",
    "crates/jeod_gravity",
    "crates/jeod_frames",
    "crates/jeod_planet",
    "crates/jeod_time",
    "crates/jeod_ephemeris",
    "crates/bevy_jeod_dynamics",
    "crates/bevy_jeod_gravity",
    "crates/bevy_jeod_frames",
    "crates/bevy_jeod_time",
    "crates/bevy_jeod_ephemeris",
    "crates/bevy_jeod_planet",
    "crates/jeod_test_data",
]

[workspace.dependencies]
glam = { version = "0.30", features = ["std"] }
bevy = { version = "0.18", default-features = false, features = [
    "bevy_log",
    "bevy_state",
    "std",
    "multi_threaded",
] }
thiserror = "2"

[[example]]
name = "kepler_orbit"
path = "examples/kepler_orbit.rs"

[[example]]
name = "batch_propagation"
path = "examples/batch_propagation.rs"
