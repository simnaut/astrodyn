[package]
name = "bevy_jeod"
description = "Bevy ECS adapter for the JEOD orbital-dynamics port"
keywords = ["bevy", "orbital-mechanics", "simulation", "aerospace", "jeod"]
categories = ["science", "simulation", "aerospace"]
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
jeod_sim = { path = "crates/jeod_sim", version = "0.1.0" }
glam = { workspace = true }
bevy = { workspace = true }
bevy_reflect = { workspace = true }

[dev-dependencies]
glam = { workspace = true }
jeod_test_data = { path = "crates/jeod_test_data", version = "0.1.0" }
jeod_sim = { path = "crates/jeod_sim", version = "0.1.0" }
jeod_runner = { path = "crates/jeod_runner", version = "0.1.0" }
# Examples consume `recipes::orbital_elements` and convert into the
# Bevy components, which requires the typed orbital-init helper plus
# uom unit constructors.
jeod_dynamics = { path = "crates/jeod_dynamics", version = "0.1.0" }
jeod_quantities = { path = "crates/jeod_quantities", version = "0.1.0" }
uom = { workspace = true }

[workspace]
resolver = "2"
members = [
    "crates/jeod_quantities",
    "crates/jeod_math",
    "crates/jeod_dynamics",
    "crates/jeod_gravity",
    "crates/jeod_frames",
    "crates/jeod_planet",
    "crates/jeod_time",
    "crates/jeod_ephemeris",
    "crates/jeod_atmosphere",
    "crates/jeod_interactions",
    "crates/jeod_test_data",
    "crates/jeod_sim",
    "crates/jeod_runner",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/simnaut/bevy_jeod"

[workspace.dependencies]
glam = { version = "0.30", features = ["std"] }
bevy = { version = "0.18", default-features = false, features = [
    "bevy_log",
    "bevy_state",
    "std",
    "multi_threaded",
] }
bevy_reflect = { version = "0.18", default-features = false }
log = "0.4"
thiserror = "2"
uom = { version = "0.38", default-features = false, features = ["f64", "si", "std"] }
typenum = "1.20"

# Optimize all code in dev/test builds — spherical harmonics evaluation
# is ~20× slower at opt-level=0, making 7-day lunar orbit tests impractical.
# opt-level=2 gives ~20× speedup with minimal compile-time increase.
[profile.dev]
opt-level = 2
debug = "line-tables-only"
[profile.test]
opt-level = 2
debug = "line-tables-only"

[[example]]
name = "kepler_orbit"
path = "examples/kepler_orbit.rs"

[[example]]
name = "typed_mission"
path = "examples/typed_mission.rs"
