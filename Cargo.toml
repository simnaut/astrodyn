[package]
name = "bevy_jeod"
version = "0.1.0"
edition = "2021"

[dependencies]
jeod_sim = { path = "crates/jeod_sim" }
glam = { workspace = true }
bevy = { workspace = true }

[dev-dependencies]
glam = { workspace = true }
jeod_test_data = { path = "crates/jeod_test_data" }
jeod_sim = { path = "crates/jeod_sim" }
jeod_runner = { path = "crates/jeod_runner" }
# Examples consume `recipes::orbital_elements` and convert into the
# Bevy components, which requires the typed orbital-init helper plus
# uom unit constructors.
jeod_dynamics = { path = "crates/jeod_dynamics" }
jeod_quantities = { path = "crates/jeod_quantities" }
uom = { workspace = true }

[workspace]
resolver = "2"
members = [
    "crates/jeod_quantities",
    "crates/jeod_math",
    "crates/jeod_dynamics",
    "crates/jeod_gravity",
    "crates/jeod_frames",
    "crates/jeod_planet",
    "crates/jeod_time",
    "crates/jeod_ephemeris",
    "crates/jeod_atmosphere",
    "crates/jeod_interactions",
    "crates/jeod_test_data",
    "crates/jeod_sim",
    "crates/jeod_runner",
    "xtask",
]

[workspace.dependencies]
glam = { version = "0.30", features = ["std"] }
bevy = { version = "0.18", default-features = false, features = [
    "bevy_log",
    "bevy_state",
    "std",
    "multi_threaded",
] }
log = "0.4"
thiserror = "2"
uom = { version = "0.38", default-features = false, features = ["f64", "si", "std"] }
typenum = "1.20"

# Optimize all code in dev/test builds — spherical harmonics evaluation
# is ~20× slower at opt-level=0, making 7-day lunar orbit tests impractical.
# opt-level=2 gives ~20× speedup with minimal compile-time increase.
[profile.dev]
opt-level = 2
[profile.test]
opt-level = 2

[[example]]
name = "kepler_orbit"
path = "examples/kepler_orbit.rs"

[[example]]
name = "typed_mission"
path = "examples/typed_mission.rs"
