[package]
name = "astrodyn"
description = "Pipeline orchestration, VehicleBuilder, and recipes — single API surface for ECS adapters"
keywords = ["orbital-mechanics", "simulation", "aerospace", "ecs", "physics"]
categories = ["science", "aerospace", "simulation"]
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# `jeod-source` is workspace-internal: it exposes the
# `recipes::verification` Tier 3 cross-validation scaffolding (gravity
# recipes backed by `test_data/gravity/*.bin` plus the
# `VerificationCase` / `Tolerances` / `CsvReference` types). The
# fixture binaries live at the workspace root of *this repository* and
# are not packaged with the crate, so the recipes only work in-repo —
# enabling this feature from a downstream workspace will panic at
# runtime when the loader can't find the binaries. The corresponding
# Rust module is also hidden from rendered rustdoc so it doesn't leak
# into the published page. `astrodyn_runner`'s `run_verification` rigs and the
# in-repo examples are the only intended consumers; mission code
# should not enable this feature.
jeod-source = ["dep:astrodyn_test_data"]

# Hide the workspace-internal `jeod-source` feature from docs.rs builds
# so the published documentation surfaces only the mission-facing
# recipes.
[package.metadata.docs.rs]
no-default-features = true
features = []

[dependencies]
astrodyn_quantities = { path = "crates/astrodyn_quantities", version = "0.1.0" }
astrodyn_math = { path = "crates/astrodyn_math", version = "0.1.0" }
astrodyn_dynamics = { path = "crates/astrodyn_dynamics", version = "0.1.0" }
astrodyn_gravity = { path = "crates/astrodyn_gravity", version = "0.1.0" }
astrodyn_time = { path = "crates/astrodyn_time", version = "0.1.0" }
astrodyn_frames = { path = "crates/astrodyn_frames", version = "0.1.0" }
astrodyn_atmosphere = { path = "crates/astrodyn_atmosphere", version = "0.1.0" }
astrodyn_interactions = { path = "crates/astrodyn_interactions", version = "0.1.0" }
astrodyn_ephemeris = { path = "crates/astrodyn_ephemeris", version = "0.1.0" }
astrodyn_planet = { path = "crates/astrodyn_planet", version = "0.1.0" }
# Optional: only pulled in when the `jeod-source` feature is enabled.
# Used by `recipes::verification::reference_data` to load committed
# gravity-coefficient binaries via `astrodyn_test_data::gravity_fixtures`.
# `astrodyn_test_data` is the dev/test-data crate; this is the single
# non-dev consumer.
astrodyn_test_data = { path = "crates/astrodyn_test_data", version = "0.1.0", optional = true }
glam = { workspace = true }
log = { workspace = true }
uom = { workspace = true }

[dev-dependencies]
astrodyn_test_data = { path = "crates/astrodyn_test_data", version = "0.1.0" }

[workspace]
resolver = "2"
members = [
    "crates/astrodyn_quantities",
    "crates/astrodyn_math",
    "crates/astrodyn_dynamics",
    "crates/astrodyn_gravity",
    "crates/astrodyn_frames",
    "crates/astrodyn_planet",
    "crates/astrodyn_time",
    "crates/astrodyn_ephemeris",
    "crates/astrodyn_atmosphere",
    "crates/astrodyn_interactions",
    "crates/astrodyn_test_data",
    "crates/astrodyn_bevy",
    "crates/astrodyn_runner",
    "crates/astrodyn_verif_jeod",
    "crates/astrodyn_verif_parity",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/simnaut/astrodyn"

[workspace.dependencies]
glam = { version = "0.30", features = ["std"] }
bevy = { version = "0.18", default-features = false, features = [
    "bevy_log",
    "bevy_state",
    "std",
    "multi_threaded",
] }
bevy_reflect = { version = "0.18", default-features = false }
log = "0.4"
thiserror = "2"
uom = { version = "0.38", default-features = false, features = ["f64", "si", "std"] }
typenum = "1.20"

# Per-package opt-levels: hot numerical crates need optimization (spherical
# harmonics is ~20× slower at opt-level=0), but orchestration crates can
# compile faster at opt-level=1. Dependencies compile once at opt-level=3
# and are cached by sccache, so we pay that cost once.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.astrodyn_math]
opt-level = 3
[profile.dev.package.astrodyn_gravity]
opt-level = 3
[profile.dev.package.astrodyn_dynamics]
opt-level = 3
[profile.dev.package.astrodyn_ephemeris]
opt-level = 3
[profile.dev.package.astrodyn_atmosphere]
opt-level = 3
[profile.dev.package.astrodyn_interactions]
opt-level = 3

[profile.test]
opt-level = 1
debug = "line-tables-only"

[profile.test.package."*"]
opt-level = 3

[profile.test.package.astrodyn_math]
opt-level = 3
[profile.test.package.astrodyn_gravity]
opt-level = 3
[profile.test.package.astrodyn_dynamics]
opt-level = 3
[profile.test.package.astrodyn_ephemeris]
opt-level = 3
[profile.test.package.astrodyn_atmosphere]
opt-level = 3
[profile.test.package.astrodyn_interactions]
opt-level = 3
