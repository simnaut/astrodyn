[package]
name = "bevy_jeod"
version = "0.1.0"
edition = "2021"

[dependencies]
jeod_sim = { path = "crates/jeod_sim" }
glam = { workspace = true }
bevy = { workspace = true }

[dev-dependencies]
glam = { workspace = true }
jeod_test_data = { path = "crates/jeod_test_data" }
jeod_sim = { path = "crates/jeod_sim" }

[workspace]
resolver = "2"
members = [
    "crates/jeod_math",
    "crates/jeod_dynamics",
    "crates/jeod_gravity",
    "crates/jeod_frames",
    "crates/jeod_planet",
    "crates/jeod_time",
    "crates/jeod_ephemeris",
    "crates/jeod_atmosphere",
    "crates/jeod_interactions",
    "crates/jeod_test_data",
    "crates/jeod_sim",
]

[workspace.dependencies]
glam = { version = "0.30", features = ["std"] }
bevy = { version = "0.18", default-features = false, features = [
    "bevy_log",
    "bevy_state",
    "std",
    "multi_threaded",
] }
log = "0.4"
thiserror = "2"

[[example]]
name = "kepler_orbit"
path = "examples/kepler_orbit.rs"

[[example]]
name = "batch_propagation"
path = "examples/batch_propagation.rs"

[[example]]
name = "leo_drag"
path = "examples/leo_drag.rs"
